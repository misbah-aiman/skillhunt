<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillHunt</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #fafafa;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  main {
    text-align: center;
    padding: 2rem;
    max-width: 600px;
  }

  h1 {
    font-size: 2.5rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
  }

  p.tagline {
    font-size: 1.1rem;
    color: #666;
    margin-bottom: 3rem;
  }

  blockquote {
    font-size: 1.2rem;
    font-style: italic;
    color: #333;
    border-left: 3px solid #1a1a1a;
    padding-left: 1rem;
    text-align: left;
  }

  blockquote footer {
    margin-top: 0.5rem;
    font-size: 0.95rem;
    font-style: normal;
    color: #888;
  }
</style>
</head>
<body>
  <main>
    <h1>SkillHunt</h1>
    <p class="tagline">Find the skills that find you the job.</p>
    <blockquote>
      "The expert in anything was once a beginner."
      <footer>— Helen Hayes</footer>
    </blockquote>
  </main>
</body>
</html>
